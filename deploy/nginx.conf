# Directives for the darner-demo.dejima.page server block, inside whatever TLS
# setup the host already uses. `root` follows the `current` symlink per
# request, so a deploy takes effect without reloading nginx.
root /srv/www/darner-demo.dejima.page/current;
index index.html;

# darner-web's own headers, its CSP included. No location below adds a header,
# so each inherits these: an add_header there would replace them all.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; require-trusted-types-for 'script'; trusted-types 'none'" always;
add_header Referrer-Policy no-referrer always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
expires -1;

# Every session's page is one page, which fills itself in from the browser's own sessions.
location ~ "^/sessions/dn-[a-z0-9-]+$" {
    try_files /sessions/view.html =404;
}

# And every session's zip is the demo's one.
location ~ "^/sessions/dn-[a-z2-7]{5}/outputs/[0-9]+\.zip$" {
    try_files /demo/output.zip =404;
}

location / {
    try_files $uri $uri.html $uri/ =404;
}

# Fonts and brand images change rarely, but their names don't change with
# them, so they're cached for a week rather than marked immutable.
location /static/ {
    expires 7d;
}
